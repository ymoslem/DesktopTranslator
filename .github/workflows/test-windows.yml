name: Test on Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose Windows installer to test, e.g. v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download the installer and the French-to-English model
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.tag }}" --pattern "DesktopTranslator_Windows_*.exe" --dir installer
          gh release download v0.2.3 --pattern "fren.zip" --dir model
          Expand-Archive model/fren.zip -DestinationPath model

      - name: Run the smoke test on the source code
        run: python tests/smoke_test.py model/fren

      - name: Install the installer silently
        run: |
          $installer = Get-ChildItem installer/*.exe | Select-Object -First 1
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          Get-ChildItem "C:\Program Files\DesktopTranslator" | Select-Object -First 20 | Format-Table Name, Length

      - name: Check the data files in the installed app
        run: |
          $missing = @()
          foreach ($name in "tr.txt", "lid.176.ftz", "nllb_languages.json", "m2m_languages.json", "fasttext_to_flores.json") {
            $found = Get-ChildItem "C:\Program Files\DesktopTranslator" -Recurse -Filter $name -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { Write-Host "found   $name" } else { Write-Host "MISSING $name"; $missing += $name }
          }
          if ($missing.Count -gt 0) { exit 1 }

      - name: Start the installed app and take a screenshot
        run: |
          $process = Start-Process "C:\Program Files\DesktopTranslator\DesktopTranslator.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($process.HasExited) { Write-Host "The app exited with code $($process.ExitCode)"; exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.CopyFromScreen($screen.Left, $screen.Top, 0, 0, $bitmap.Size)
          $bitmap.Save("screenshot.png")
          Stop-Process -Id $process.Id

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-screenshot
          path: screenshot.png
          if-no-files-found: ignore
