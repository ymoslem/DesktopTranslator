name: Build installers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v0.2.4"
        required: true
      attach:
        description: "Attach the installers to the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
            separator: ":"
          - os: windows-latest
            name: Windows
            separator: ";"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt pyinstaller==6.22.3

      - name: Build the app
        run: |
          pyinstaller -y --windowed --name DesktopTranslator \
            --add-data "utils${{ matrix.separator }}utils" \
            --collect-data sentence_splitter \
            --collect-data pysbd \
            --collect-all Pmw \
            --collect-all ctranslate2 \
            translator.py

      - name: Package for macOS
        if: matrix.name == 'macOS'
        run: |
          VERSION="${INPUT_TAG#v}"
          ditto -c -k --keepParent dist/DesktopTranslator.app "DesktopTranslator_macOS_${VERSION}.zip"
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - name: Package for Windows
        if: matrix.name == 'Windows'
        run: |
          VERSION="${INPUT_TAG#v}"
          choco install nsis -y --no-progress
          "/c/Program Files (x86)/NSIS/makensis.exe" "//DVERSION=${VERSION}" installer.nsi
        env:
          INPUT_TAG: ${{ inputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: DesktopTranslator-${{ matrix.name }}
          path: |
            DesktopTranslator_macOS_*.zip
            DesktopTranslator_Windows_*.exe

      - name: Attach to the release
        if: inputs.attach
        run: gh release upload "$INPUT_TAG" DesktopTranslator_${{ matrix.name }}_* --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
